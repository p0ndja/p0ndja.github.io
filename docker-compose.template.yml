services:
  me_pondja_php:
    container_name: me_pondja_php
    image: php:8.2-apache
    restart: unless-stopped
    networks:
      - traefik_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.me_pondja_php-http.rule=Host(`me.pondja.localhost`) || Host(`me.pondja.com`)"
      - "traefik.http.routers.me_pondja_php-http.entrypoints=web"
      - "traefik.http.routers.me_pondja_php-http.service=me_pondja_php"
      - "traefik.http.services.me_pondja_php.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik_network"
    volumes:
      - ./:/var/www/html
networks:
  traefik_network:
    external: true
